# Development tools only — Kiln's server runs on Python's standard library (see README).

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Correctness first: pyflakes (F), real syntax/indentation errors (E9/E7/E4), import order (I), Python upgrades (UP).
# Raised as the server is split into a package (ROADMAP v0.7 step 6): bugbear (B), blind excepts (BLE), bandit (S).
select = ["F", "E4", "E7", "E9", "I", "UP"]
# Style of the dense one-line code — fixed by the formatter pass (step 3), then switched back on.
ignore = ["E701", "E702", "E731", "E741"]
