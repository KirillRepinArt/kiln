# Development tools only — Kiln's server runs on Python's standard library (see README).

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# pyflakes (F), real syntax/indentation errors (E9/E7/E4), import order (I), Python upgrades (UP), likely bugs
# (bugbear B), broad excepts (BLE: each one that stays says why), security (bandit S: subprocess / URL calls say why),
# Ruff's own (RUF).
select = ["F", "E4", "E7", "E9", "I", "UP", "B", "BLE", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tools/**" = ["S", "BLE"]  # development tools and tests: they start processes and swallow on purpose

[tool.mypy]
# The server's types, checked like the page's (tsc): strict, for Windows (Kiln's platform; the Windows-only calls
# are then checked rather than ignored). `.venv\Scripts\python -m mypy`
files = ["server"]
python_version = "3.10"
platform = "win32"
strict = true
