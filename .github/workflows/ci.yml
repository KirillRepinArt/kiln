# Runs on every push and pull request: the linters and privacy scan (quick, Linux), then the end-to-end tests
# (Windows + Edge, like the real thing). Kiln itself installs nothing — these are development tools only.
name: CI
on: [push, pull_request]
# a newer push to the same branch cancels the run still going for an older one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@v6
        with: { python-version: "3.10" }
      - run: npm ci
      - run: npm run lint
      - run: pip install -r requirements-dev.txt
      - run: ruff check
      - run: python tools/privacy_scan.py --all

  e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.10" }
      - run: node tools/tests/run.mjs -j 2
      - uses: actions/upload-artifact@v5
        if: failure()
        with: { name: test-screenshots, path: tools/tests/out/ }
