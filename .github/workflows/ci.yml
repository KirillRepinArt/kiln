# Runs on every push and pull request: the linters and privacy scan (quick, Linux), then the end-to-end tests
# (Windows + Edge, like the real thing). Kiln itself installs nothing — these are development tools only.
name: CI
on: [push, pull_request]
# a newer push to the same branch cancels the run still going for an older one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@v7
        with: { python-version: "3.10" }
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: pip install -r requirements-dev.txt
      - run: ruff check
      - run: ruff format --check
      - run: mypy
      - run: python -m unittest discover -s tools/tests/unit
      - run: python tools/privacy_scan.py --all

  e2e:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@v7
        with: { python-version: "3.10" }
      - run: npm ci # axe-core (a11y.test.mjs)
      - run: node tools/tests/run.mjs -j 2
        env: { KILN_SKIP: cases } # the case table: its own job, in parallel (below)
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: test-screenshots, path: tools/tests/out/ }

  # the case table (tools/tests/cases.test.mjs, v0.7c's acceptance): every edge of every layout × page — ~13 min on
  # CI's runners, so a job of its own beside e2e, each under its limit
  cases:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - uses: actions/setup-python@v7
        with: { python-version: "3.10" }
      - run: node tools/tests/run.mjs cases -j 2
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: case-screenshots, path: tools/tests/out/ }
