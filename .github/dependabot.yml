# Dependabot: once a month, a pull request when something pinned has a newer version (CI runs on it before
# anything is merged). Grouped: one PR per area. Only development tools and CI — Kiln itself installs nothing.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: forge-wiring
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: npm
    directory: /
    target-branch: forge-wiring
    schedule: { interval: monthly }
    groups:
      dev-tools: { patterns: ["*"] }

  - package-ecosystem: pip
    directory: /
    target-branch: forge-wiring
    schedule: { interval: monthly }
    groups:
      dev-tools: { patterns: ["*"] }
    # Kiln runs on Python 3.10 (README; CI's python-version): no version that drops it. Pillow 13 needs 3.11 —
    # its bump failed CI's install (2026-11-11). Lift this with the Python floor.
    ignore:
      - dependency-name: pillow
        versions: [">=13"]
